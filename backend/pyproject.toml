[project]
name = "south-asian-fitness-api"
version = "0.1.0"
description = "REST API for the South Asian Fitness SaaS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "alembic>=1.14.0",
    "bcrypt>=4.1.2",
    "email-validator>=2.3.0",
    "pycountry>=26.2.16",
    "pycountry-convert>=0.7.2",
    "httpx>=0.28.1",
    "openai>=3.6.0",
    "google-auth>=2.57.0",
    "sentry-sdk[fastapi]>=2.68.1",
    "fastmcp>=4.0.3",
    "langfuse>=4.15.1",
    "pgvector>=0.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.1",
]

[tool.uv]
package = false
link-mode = "copy"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app"]

[tool.ruff.lint]
ignore = ["B008"]
