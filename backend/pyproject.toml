[project]
name = "south-asian-fitness-api"
version = "0.1.0"
description = "REST API for the South Asian Fitness SaaS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "alembic>=1.14.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.uv]
package = false
link-mode = "copy"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app"]
